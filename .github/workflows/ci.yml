name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, for which setup-python has no 3.9
    # build ("The version '3.9' with architecture 'x64' was not found"), so
    # 3.9 runs on the last image that has it rather than dropping out.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        # Every version the hosted runners still provide. The declared
        # floor is 3.6, which setup-python can no longer install, so the
        # bottom of the range runs in a container in the python-floor job
        # below; vermin covers 3.7/3.8 statically.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # The suite runs the real agent against a fake fleet -- shims that
      # execute the "remote" commands in a sandbox per host -- so it needs
      # nothing installed beyond bash, tar and python.
      - name: Run the test suite
        run: ./tests/run_tests.sh

  python-floor:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches stdlib APIs newer than the floor, which a syntax-only
      # compile check cannot see. The agent runs on whatever python3 the
      # fleet has, so this floor is load-bearing.
      - name: Scan for post-3.6 syntax and stdlib APIs
        run: |
          python -m pip install --upgrade vermin
          ./tests/check_python_compat.sh
          # The '-' suffix means "3.6 or later"; a bare --target=3.6 asks
          # for code that needs *exactly* 3.6 and fails on anything older.
          vermin --eval-annotations --violations --target=3.6- \
            testing_orchestrator/*.py

      # Hosted runners no longer offer a 3.6 toolchain, so use the
      # container. Checkout runs on the host, so there is no node20 issue.
      #
      # Nothing is installed into the image. python:3.6-slim is long EOL,
      # so its bullseye security Release file has expired and `apt-get
      # update` exits 100 -- and the suite does not need anything apt
      # would provide: bash, tar, find and coreutils are all Essential
      # and already there. procps is not required either; tx's pgrep
      # paths are fallbacks for when a pid file is missing, and the suite
      # passes with pgrep and pkill absent.
      - name: Run the suite under real Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            bash -euxc './tests/check_python_compat.sh && ./tests/run_tests.sh'

  docs:
    name: docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same invocation Read the Docs runs, with warnings as errors, so a
      # docs break fails the PR here instead of surfacing on RTD later.
      # The CLI reference is generated from the live parsers during this
      # build, so a new flag that would render badly also fails here.
      - name: Build the docs
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # SC1091 only says shellcheck cannot open the sourced helper from
      # its own working directory; following it instead (-x) makes every
      # test function look unreachable, because run_test calls them by
      # name. Excluding the one info-level check is the honest trade.
      - name: Run shellcheck over the test harness
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 tests/*.sh tests/test_helper.bash

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check licensing headers
        run: |
          python -m pip install --upgrade reuse
          reuse lint

  build:
    name: build the wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # A pip install must put a working `tx` on PATH -- that is the
      # documented install path.
      - name: Install the wheel and smoke-test the entry point
        run: |
          python -m pip install dist/*.whl
          tx --version
          printf 'a\nb\nc\n' > servers.txt
          tx gen --servers servers.txt --run 'echo hi'
          tx check
          tx hints > /dev/null
          tx help > /dev/null

  # Every change moves the version (CLAUDE.md; shared_tools BN-002, whose
  # templates/version-job.yml this is, with this workflow's checkout@v4).
  # The first step fails when pyproject.toml, __init__.py and tx.py disagree,
  # or CHANGELOG.md does not open with that version, numbered and dated. On
  # a pull request the second fails unless the version is greater than the
  # base branch's. On a push to main the third fails unless it is greater
  # than what main was before the push: two pull requests that each took the
  # same number pass their own checks and are caught only there.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD
